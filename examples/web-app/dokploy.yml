# yaml-language-server: $schema=https://raw.githubusercontent.com/pythoninthegrass/icarus/main/schemas/dokploy.schema.json

# Web application with worker, scheduler, and monitoring
# GitHub-sourced app + Docker services

project:
  name: my-web-app
  description: |
    Web application with async task processing

  env_targets: [web, worker, beat]

  deploy_order:
    - [redis]
    - [web, worker, beat, flower]

github:
  owner: your-org
  repository: your-app
  branch: main

environments:
  prod:
    apps:
      web:
        domain:
          host: app.example.com
          port: 8000
          https: true
          certificateType: letsencrypt
        # Overrides replace the whole resources block from the base app
        resources:
          memoryLimit: 1G
          memoryReservation: 512M
          cpuLimit: 2
      flower:
        domain:
          host: flower.example.com
          port: 5555
          https: true
          certificateType: letsencrypt
  dev:
    github:
      branch: develop
    apps:
      web:
        domain:
          host: app-dev.example.com
          port: 8000
          https: true
          certificateType: letsencrypt

apps:
  - name: redis
    source: docker
    dockerImage: redis:7-alpine
    resources:
      memoryLimit: 256M
    healthCheck:
      command: redis-cli ping
      interval: 30s
      timeout: 5s
      retries: 3
    restartPolicy:
      condition: on-failure
      delay: 5s
      maxAttempts: 3
      window: 120s

  - name: web
    source: github
    autoDeploy: true
    resources:
      memoryLimit: 512M
      memoryReservation: 256M
      cpuLimit: 1
    healthCheck:
      command: curl -f http://localhost:8000/health
      interval: 30s
      timeout: 10s
      startPeriod: 60s
      retries: 3
    redirects:
      - regex: "^/blog$"
        replacement: "https://blog.example.com"
        permanent: true
      - regex: "^/docs/(.*)"
        replacement: "/documentation/$1"
        permanent: false

  - name: worker
    source: github
    command: >-
      celery -A myproject worker
      --loglevel=INFO --concurrency=4 --max-tasks-per-child=200

  - name: beat
    source: github
    command: >-
      celery -A myproject beat
      --loglevel=INFO --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule

  - name: flower
    source: docker
    dockerImage: mher/flower:2.0.1
    command: >-
      celery --broker=redis://{redis}:6379/0 flower
      --port=5555 --address=0.0.0.0
    env: |
      TZ=UTC
      CELERY_BROKER_URL=redis://{redis}:6379/0
